name: Check application and Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: docker compose config --quiet
      - run: npx playwright install --with-deps chromium
      - run: npm run test:images
      - run: npm run test:carousel
      - run: npm run test:services
      - run: npm run test:styles
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: node-studio:ci
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify running container and Gzip delivery
        run: |
          docker compose up -d --no-build --wait
          docker compose exec -T app node scripts/healthcheck.mjs
          docker compose exec -T app node --input-type=module -e '
            const response = await fetch("http://127.0.0.1:3000/", { headers: { "Accept-Encoding": "gzip" } });
            if (!response.ok || response.headers.get("content-encoding") !== "gzip") throw new Error("Gzip delivery failed");
            await response.text();
          '
        env:
          IMAGE_TAG: ci
          SOURCE_REVISION: ${{ github.sha }}
      - name: Stop test container
        if: always()
        run: docker compose down
        env:
          IMAGE_TAG: ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: test-results/
