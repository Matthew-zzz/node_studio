server {
    listen 80;
    listen [::]:80;
    server_name node-studio.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/node-studio.ru/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://node-studio.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name node-studio.ru;

    ssl_certificate /etc/letsencrypt/live/node-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node-studio.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:node_studio_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/node-studio.ru/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location ^~ /_next/static/ {
        root /var/www/node-studio.ru/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }
}
