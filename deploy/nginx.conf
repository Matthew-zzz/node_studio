server {
    listen 80;
    listen [::]:80;
    server_name node-studio.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/node-studio.ru/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://node-studio.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name node-studio.ru;

    ssl_certificate /etc/letsencrypt/live/node-studio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node-studio.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:node_studio_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 128k;
    # The app serves build-time .gz files and falls back to originals.
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:3158;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
