# Temporary portfolio. Previous configuration is saved by deploy-scorevo.sh.
server {
    server_name scorevo.ru www.scorevo.ru;

    client_max_body_size 50M;
    root /var/www/scorevo-portfolio/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Keep assets available to already loaded Herdr clients.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri @herdr_asset;
    }

    location @herdr_asset {
        root /var/www/herdr-miniapp;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
        if_modified_since off;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/scorevo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scorevo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = scorevo.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name scorevo.ru www.scorevo.ru;
    return 404;
}
