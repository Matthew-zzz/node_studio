name: node-studio

services:
  app:
    image: node-studio:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        SITE_ORIGIN: ${SITE_ORIGIN:-https://node-studio.ru}
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3158}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Retired portal data is deliberately detached and preserved pending a deletion decision.
  portal-data:
